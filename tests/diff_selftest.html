<!DOCTYPE html>
<!--
  Headless-Chrome walkthrough of the Difference Analysis tab, driven against
  sample/assets.parquet -- the fixture whose columns each have exactly one
  defensible verdict. Run by tests/run.sh; the API-level checks that cross-check
  the classifications against SQL live in tests/test_api.py.
-->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/static/styles.css"></head>
<body><div id="results" style="display:none">PENDING</div><div id="host"></div>
<script>
const log = [];
const ok = (n, p, extra='') => log.push(`${p?'PASS':'FAIL'} | ${n} | ${extra}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms=30000){const t=Date.now();while(Date.now()-t<ms){if(fn())return true;await sleep(80);}return false;}
(async () => {
 try {
  const html = await (await fetch('/')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);
  await new Promise((res, rej) => { const s=document.createElement('script'); s.src='/static/app.js'; s.onload=res; s.onerror=rej; document.body.appendChild(s); });

  await openPath(new URLSearchParams(location.search).get('path'));
  await until(() => state.dataset);
  ok('fixture opens', !!state.dataset, `${state.dataset.row_count} rows`);

  document.getElementById('tab-diff').click();
  await until(() => !document.getElementById('diff-view').hidden);
  ok('difference tab shows its panel', state.mode === 'diff');
  await until(() => document.getElementById('diff-key').options.length > 0);
  ok('key column guessed from the schema', state.diff.key === 'asset_id', state.diff.key);
  ok('explanatory column guessed too', state.diff.explain === 'depr_area', state.diff.explain);
  ok('nothing runs on arrival', state.diff.results.length === 0 && !state.diff.jobId);
  ok('the empty state explains the tab', !document.getElementById('diff-empty').hidden);

  // The rail becomes the picker, and it starts with nothing picked.
  ok('the rail turns into the column picker',
     !document.getElementById('rail-tools-diff').hidden
     && document.getElementById('rail-tools-data').hidden);
  ok('every column starts unpicked', state.diff.include.size === 0);
  ok('a tick box per rail row',
     document.querySelectorAll('#column-list .pick-box').length === state.dataset.columns.length);
  ok('the key is marked in the rail and cannot be picked',
     !!document.querySelector('#column-list .role-tag.key')
     && !!document.querySelector('#column-list .pick-box.locked'));
  ok('run is refused while nothing is picked',
     document.getElementById('btn-diff-run').disabled);

  // Picking one column from the rail is the whole interaction.
  const railRow = [...document.querySelectorAll('#column-list .col-item')]
    .find(li => li.querySelector('.col-name').textContent.startsWith('cost_center'));
  railRow.click();
  ok('clicking a rail row picks the column', state.diff.include.has('cost_center'));
  ok('and it shows in the tray',
     [...document.querySelectorAll('#diff-picked .pc-name')].some(n => n.textContent === 'cost_center'));
  ok('the count follows the picks',
     document.getElementById('diff-pick-count').textContent.startsWith('1 of'));
  railRow.click();
  ok('clicking again unpicks it', !state.diff.include.has('cost_center'));

  // full run, no sampling, over everything the picker offers
  document.getElementById('btn-rail-all').click();
  ok('“All” picks every column but the key',
     state.diff.include.size === state.dataset.columns.length - 1, `${state.diff.include.size}`);
  document.getElementById('diff-sample').value = '';
  document.getElementById('diff-sample').onchange();
  document.getElementById('diff-skip-blank').checked = false;
  document.getElementById('diff-skip-blank').onchange();
  document.getElementById('btn-diff-run').click();
  ok('progress bar appears at once', !document.getElementById('diff-progress').hidden);
  await until(() => state.diff.status && ['done','error','cancelled'].includes(state.diff.status.status));
  ok('the run completes', state.diff.status.status === 'done', state.diff.status.status);
  ok('every column got a verdict', state.diff.results.length === state.diff.status.total,
     `${state.diff.results.length}/${state.diff.status.total}`);

  const rows = document.querySelectorAll('#diff-body tr');
  ok('a table row per column', rows.length === state.diff.results.length, `${rows.length} tr`);
  ok('the setup collapses once there is an answer',
     !state.diff.setupOpen && document.getElementById('diff-setup-body').hidden);
  ok('and its recap names the run',
     /one row per asset_id/.test(document.getElementById('diff-setup-recap').textContent),
     document.getElementById('diff-setup-recap').textContent);
  ok('a headline states the finding',
     /business rule|collapsed mechanically/.test(document.getElementById('diff-headline').textContent),
     document.getElementById('diff-headline').textContent);
  ok('the verdict track has a segment per verdict',
     document.querySelectorAll('#diff-vb-track .vb-seg').length ===
     new Set(state.diff.results.map(r => r.verdict)).size);
  ok('every row carries a split bar',
     document.querySelectorAll('#diff-body .split-bar').length === rows.length);
  const worst = state.diff.results.map(r => VERDICT_ORDER.indexOf(r.verdict))
    .reduce((a, b) => Math.max(a, b), -1);
  ok('the pile that needs a person sorts to the top',
     VERDICT_ORDER.indexOf(visibleDiffRows()[0].verdict) === worst,
     visibleDiffRows()[0].verdict);
  const byCol = Object.fromEntries(state.diff.results.map(r => [r.column, r.verdict]));
  ok('cost_center reads CONSTANT', byCol.cost_center === 'CONSTANT', byCol.cost_center);
  ok('last_changed_by reads unexplained', byCol.last_changed_by === 'TRUE_DIFF_OTHER', byCol.last_changed_by);
  ok('verdict tags are colour-coded',
     !!document.querySelector('#diff-body .verdict-tag.vt-TRUE_DIFF_OTHER'));

  // findings banner
  const findings = document.getElementById('diff-findings').textContent;
  ok('duplicate grain is surfaced above the table', /grain is not one row per/.test(findings),
     findings.slice(0, 70));

  // chips isolate a verdict
  const chips = [...document.querySelectorAll('.verdict-chip')];
  ok('a chip per verdict present, plus All', chips.length >= 4, `${chips.length} chips`);
  const unexplainedChip = chips.find(c => /Unexplained/.test(c.textContent));
  unexplainedChip.click();
  ok('chip isolates the unexplained set',
     [...document.querySelectorAll('#diff-body tr')].length ===
     state.diff.results.filter(r => r.verdict === 'TRUE_DIFF_OTHER').length);
  unexplainedChip.click();
  ok('clicking it again clears the filter', state.diff.verdictFilter === null);

  // search + sort
  document.getElementById('diff-search').value = 'serial';
  document.getElementById('diff-search').oninput();
  ok('search narrows the table', document.querySelectorAll('#diff-body tr').length === 1);
  document.getElementById('diff-search').value = '';
  document.getElementById('diff-search').oninput();
  const firstHeader = document.querySelector('#diff-head th.sortable');
  firstHeader.click();
  ok('headers sort the table', state.diff.sort.by === 'column');

  // drill-down
  const target = [...document.querySelectorAll('#diff-body tr')]
    .find(tr => tr.textContent.startsWith('last_changed_by'));
  target.click();
  await until(() => state.diff.examples && state.diff.examples.assets.length);
  ok('drill-down panel opens', !document.getElementById('diff-detail').hidden);
  ok('it names the column', document.getElementById('diff-detail-title').textContent === 'last_changed_by');
  const exRows = document.querySelectorAll('#diff-detail-body .example-table tr.differs');
  ok('differing rows are highlighted', exRows.length > 0, `${exRows.length} highlighted`);
  ok('the panel carries the counts the table dropped',
     document.querySelectorAll('#diff-detail-stats .dd-stat').length >= 5,
     `${document.querySelectorAll('#diff-detail-stats .dd-stat').length} stats`);
  ok('the distinct values are named once per example',
     document.querySelectorAll('#diff-detail-body .value-chip').length > 0);
  ok('ten examples per page', state.diff.examples.assets.length === 10,
     `${state.diff.examples.assets.length}`);
  ok('one row per depreciation area is shown',
     document.querySelectorAll('#diff-detail-body .example-asset').length ===
     state.diff.examples.assets.length);

  // jump to a specific asset
  document.getElementById('diff-asset-jump').value = 'A-000005';
  document.getElementById('diff-asset-jump').oninput();
  await until(() => state.diff.examples && state.diff.examples.assets.length === 1
                    && state.diff.examples.assets[0].asset === 'A-000005');
  ok('jumping to an asset ID works',
     state.diff.examples.assets[0].asset === 'A-000005');
  document.getElementById('diff-asset-jump').value = '';
  document.getElementById('diff-asset-jump').oninput();
  await until(() => state.diff.examples && state.diff.examples.assets.length > 1);

  // paging
  const firstPage = state.diff.examples.assets[0].asset;
  document.getElementById('diff-ex-next').click();
  await until(() => state.diff.examples && state.diff.examples.assets[0].asset !== firstPage);
  ok('paging fetches the next examples', state.diff.examples.assets[0].asset !== firstPage);

  // export through the shared drawer
  document.getElementById('btn-diff-export').click();
  ok('export drawer opens for the analysis', !document.getElementById('drawer').hidden
     && /difference analysis/i.test(document.getElementById('drawer-title').textContent));
  ok('drawer summarises the run',
     /Columns analysed/.test(document.getElementById('export-summary').textContent));
  ok('and promises ten examples per differing column',
     /10 real/.test(document.getElementById('export-summary').textContent),
     document.getElementById('export-summary').textContent.slice(-140));
  ok('only Excel and CSV are offered',
     [...document.getElementById('export-format').options].filter(o => !o.hidden).length === 2);
  document.getElementById('btn-start-export').click();
  await until(() => state.exportJob && ['done','error'].includes(state.exportJob.status), 60000);
  ok('the analysis exports', state.exportJob.status === 'done',
     `${state.exportJob.status} ${state.exportJob.filename||''}`);
  const dl = await fetch(`/api/export/${state.exportJob.id}/download`);
  ok('the workbook downloads', dl.status === 200, dl.headers.get('content-type'));
  closeDrawer();

  // sample mode is a separate, faster run
  document.getElementById('diff-setup-toggle').click();
  ok('the setup reopens on demand', state.diff.setupOpen
     && !document.getElementById('diff-setup-body').hidden);
  document.getElementById('diff-sample').value = '1000';
  document.getElementById('diff-sample').onchange();
  ok('the sample select drives the run size', state.diff.sample === 1000, String(state.diff.sample));
  state.diff.sample = 100;   // smaller than the fixture, so sampling is observable
  document.getElementById('btn-diff-run').click();
  await until(() => state.diff.status && state.diff.status.status === 'done');
  ok('sample mode runs over fewer assets', state.diff.plan.assets === 100, `${state.diff.plan.assets}`);
  ok('and says so in the findings',
     /sample mode/i.test(document.getElementById('diff-findings').textContent));

  // The finished progress bar: full width and brand yellow, not the old green.
  const fill = document.getElementById('diff-progress-fill');
  ok('a finished run fills its progress bar', fill.style.width === '100%', fill.style.width);
  ok('and the bar is EY yellow',
     getComputedStyle(fill).backgroundColor === 'rgb(255, 235, 10)',
     getComputedStyle(fill).backgroundColor);
  const tag = document.querySelector('.verdict-tag.vt-TRUE_DIFF_BY_DEPR_AREA');
  ok('the "differs by area" verdict fills with brand yellow and dark ink',
     tag && getComputedStyle(tag).backgroundColor === 'rgb(255, 235, 10)'
         && getComputedStyle(tag).color === 'rgb(26, 26, 36)',
     tag ? `${getComputedStyle(tag).backgroundColor} / ${getComputedStyle(tag).color}` : 'no tag');

  // Only the picked columns are analysed.
  document.getElementById('btn-rail-none').click();
  ok('“Clear” empties the selection', state.diff.include.size === 0
     && document.getElementById('btn-diff-run').disabled);
  setDiffColumns(['cost_center', 'last_changed_by']);
  document.getElementById('btn-diff-run').click();
  await until(() => state.diff.status && state.diff.status.status === 'done');
  ok('a two-column run analyses exactly those two',
     state.diff.results.length === 2
     && state.diff.results.every(r => ['cost_center', 'last_changed_by'].includes(r.column)),
     state.diff.results.map(r => r.column).join(','));
  ok('the rest are reported as not selected',
     (state.diff.plan.excluded || []).some(e => e.reason === 'Not selected for this run'));

  document.getElementById('tab-data').click();
  ok('switching away restores the grid', state.mode === 'data'
     && !document.getElementById('data-view').hidden);
  ok('and the rail goes back to hiding columns',
     document.getElementById('rail-tools-diff').hidden
     && !document.querySelector('#column-list .pick-box'));
 } catch (err) { log.push('FAIL | harness threw | ' + (err && err.stack ? err.stack.split('\n').slice(0,2).join(' ') : err)); }
 document.getElementById('results').textContent = 'DONE\n' + log.join('\n');
})();
window.addEventListener('error', e => log.push('FAIL | uncaught error | ' + e.message));
window.addEventListener('unhandledrejection', e => log.push('FAIL | unhandled rejection | ' + e.reason));
</script></body></html>
